<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Role | Student Assignment Tracker</title>

    <link rel="stylesheet" href="../css/role_selection.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

</div>

<h1>Welcome, Student 👋</h1>

<p class="subtitle">

Before continuing, tell us your role in your project.

</p>

<form id="roleForm">

<label class="role-card">

<input type="radio" name="role" value="member" checked>

<div class="role-content">

<div class="icon blue">

<i class="fa-solid fa-user"></i>

</div>

<div>

<h3>Team Member</h3>

<p>

View assignments, submit work,

collaborate with teammates and track your progress.

</p>

</div>

</div>

</label>

<label class="role-card">

<input type="radio" name="role" value="leader">

<div class="role-content">

<div class="icon gold">

<i class="fa-solid fa-crown"></i>

</div>

<div>

<h3>Group Leader ⭐</h3>

<p>

Assign tasks, manage members,

monitor progress and coordinate your team.

</p>

</div>

</div>

</label>

<button type="submit">

Continue

<i class="fa-solid fa-arrow-right"></i>

</button>

</form>

</div>

</div>

<script src="../js/role_selection.js"></script>

</body>

</html>
